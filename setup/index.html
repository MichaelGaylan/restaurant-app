<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <title>Restaurant Setup</title>
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Setup">
  <link rel="icon" href="assets/favicon-32.png" sizes="32x32">
  <link rel="apple-touch-icon" href="assets/app-icon-180.png">
  <link rel="stylesheet" href="../app/css/app.css">
  <link rel="stylesheet" href="css/setup.css">
  <script>
    // The wizard's own settings space (never a restaurant's).
    self.BRAND = { appName: 'Restaurant Setup', shortName: 'Setup', dataPrefix: 'rsw.setup.' };
  </script>
  <script src="../app/js/head.js"></script>
</head>
<body>
  <!-- Pinned logo header, same as the restaurant app -->
  <header id="top" class="top">
    <div class="top-logo" aria-hidden="true"><img id="brand-logo" src="assets/setup-logo.png" alt=""></div>
    <div class="top-bar">
      <button id="btn-back" class="icon-btn" type="button" aria-label="Back" hidden>
        <svg viewBox="0 0 24 24"><path d="M15 4l-8 8 8 8" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <span class="spacer"></span>
      <button id="btn-night" class="icon-btn" type="button" aria-label="Night mode">
        <svg class="i-moon" viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>
        <svg class="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      </button>
      <button id="btn-bell" class="icon-btn" type="button" hidden></button>
    </div>
    <div class="top-title">
      <h1 id="title"></h1>
      <div id="title-action"></div>
    </div>
  </header>
  <nav id="side" class="side" hidden></nav>

  <main id="view" class="view"></main>

  <nav id="tabs" class="tabs">
    <a href="#/setup" data-tab="setup">
      <svg viewBox="0 0 24 24"><path d="M12 3l2.4 4.9 5.4.8-3.9 3.8.9 5.4-4.8-2.6-4.8 2.6.9-5.4L4.2 8.7l5.4-.8z" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round"/></svg>
      <span>Setup</span></a>
    <a href="#/preview" data-tab="preview">
      <svg viewBox="0 0 24 24"><rect x="6.5" y="2.5" width="11" height="19" rx="2.5" fill="none" stroke="currentColor" stroke-width="1.9"/><path d="M10.5 18.5h3" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/></svg>
      <span>Preview</span></a>
    <a href="#/restaurants" data-tab="restaurants">
      <svg viewBox="0 0 24 24"><path d="M4 10l8-6 8 6v10H4zM9 20v-6h6v6" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round"/></svg>
      <span>Restaurants</span></a>
    <a href="#/more" data-tab="more">
      <svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.8" fill="currentColor"/><circle cx="12" cy="12" r="1.8" fill="currentColor"/><circle cx="19" cy="12" r="1.8" fill="currentColor"/></svg>
      <span>More</span></a>
  </nav>

  <dialog id="dlg" class="sheet"></dialog>
  <div id="toast" class="toast" role="status" hidden></div>

  <noscript><p style="padding:2rem">Restaurant Setup needs JavaScript turned on.</p></noscript>
  <script type="module" src="js/wizard.js"></script>
</body>
</html>
